name: Diagnose public site hosting and deployment
on:
  pull_request:
    paths:
      - 'tools/public_deploy_diagnostic.py'
      - '.github/workflows/public-deploy-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/public_deploy_diagnostic.py
