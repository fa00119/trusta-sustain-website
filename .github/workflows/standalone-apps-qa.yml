name: Standalone PowerOS & CONFORM public app QA
on:
  pull_request:
    paths:
      - 'apps/poweros-public/**'
      - 'apps/conform-public/**'
      - 'tools/qa_standalone_product_apps.cjs'
      - '.github/workflows/standalone-apps-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install chromium
      - name: Verify both Railway apps and mobile interactions
        run: node tools/qa_standalone_product_apps.cjs
