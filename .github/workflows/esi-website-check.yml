name: ESI website additive checks
on:
  pull_request:
    paths:
      - 'environmental-sustainability.html'
      - 'esi-evidence-explorer.html'
      - 'index.html'
      - 'products.html'
      - 'launch-offers.html'
      - 'partners.html'
      - 'contact.html'
      - 'scripts/check_esi_pages.py'
      - '.github/workflows/esi-website-check.yml'
jobs:
  static-esi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_esi_pages.py
