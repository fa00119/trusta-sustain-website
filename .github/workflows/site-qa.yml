name: Trusta Website QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    name: Critical pages and mobile UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public pages and product pathways
        run: python3 scripts/site_quality_check.py

  live-smoke:
    name: Public site and demo endpoint report
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public URLs (informational)
        run: python3 scripts/live_smoke_check.py

  browser-quality:
    name: Browser UI (320 / 375 / 768 / 1440 px)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright with Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate mobile navigation, previews and inquiry routes
        run: python3 scripts/browser_smoke_check.py
      - name: Upload desktop and mobile QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusta-responsive-browser-captures
          path: artifacts/website-qa/*.png
          if-no-files-found: ignore
          retention-days: 14
