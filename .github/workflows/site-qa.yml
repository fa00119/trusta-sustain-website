name: Trusta Website QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    name: Critical pages and mobile UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public pages and product pathways
        run: python3 scripts/site_quality_check.py

  live-smoke:
    name: Public site and demo endpoint report
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public URLs (informational)
        run: python3 scripts/live_smoke_check.py
