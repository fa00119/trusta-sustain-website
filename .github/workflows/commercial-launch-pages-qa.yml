name: Trusta Commercial Launch Pages QA
on:
  pull_request:
    paths:
      - 'launch-offers.html'
      - 'partners.html'
      - 'assets/launch-growth.css'
      - 'index.html'
      - 'products.html'
      - 'contact.html'
      - 'tools/qa_launch_offers.cjs'
      - '.github/workflows/commercial-launch-pages-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tools/qa_launch_offers.cjs
