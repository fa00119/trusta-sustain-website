name: Live ESI scenario download gate
on:
  pull_request:
    paths:
      - 'scripts/esi-live-download.test.mjs'
      - '.github/workflows/esi-live-download.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/esi-live-download.test.mjs
