name: Public site deployment parity
on:
  pull_request:
    paths:
      - '.github/workflows/public-site-parity.yml'
      - 'tools/check_public_site_parity.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public site matches merged marketing copy
        run: python tools/check_public_site_parity.py
